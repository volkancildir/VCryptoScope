
name: Update News

concurrency:
  group: update-news-main
  cancel-in-progress: false

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Install article extraction dependency
        run: pip install trafilatura

      - name: Fetch and classify global market news
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from html import unescape

          # Direct publisher feeds only; do not use Google News as a news provider.
          FEEDS = {
              "Kripto": [
                  ("CoinDesk", "https://www.coindesk.com/arc/outboundfeeds/rss/"),
                  ("Cointelegraph", "https://cointelegraph.com/rss"),
              ],
              "Fed & Faiz": [
                  ("CNBC", "https://www.cnbc.com/id/10001147/device/rss/rss.html"),
                  ("BBC News", "https://feeds.bbci.co.uk/news/business/rss.xml"),
                  ("Federal Reserve", "https://www.federalreserve.gov/feeds/press_all.xml"),
              ],
              "İstihdam & Enflasyon": [
                  ("CNBC", "https://www.cnbc.com/id/10001147/device/rss/rss.html"),
                  ("BBC News", "https://feeds.bbci.co.uk/news/business/rss.xml"),
              ],
              "Petrol & Enerji": [
                  ("CNBC", "https://www.cnbc.com/id/10001147/device/rss/rss.html"),
                  ("BBC News", "https://feeds.bbci.co.uk/news/business/rss.xml"),
              ],
              "Regülasyon": [
                  ("CoinDesk", "https://www.coindesk.com/arc/outboundfeeds/rss/"),
                  ("Cointelegraph", "https://cointelegraph.com/rss"),
                  ("BBC News", "https://feeds.bbci.co.uk/news/business/rss.xml"),
              ],
              "Küresel Piyasalar": [
                  ("CNBC", "https://www.cnbc.com/id/10001147/device/rss/rss.html"),
                  ("BBC News", "https://feeds.bbci.co.uk/news/business/rss.xml"),
                  ("Reuters", "https://feeds.reuters.com/reuters/businessNews"),
              ],
          }

          HEADERS = {
              "User-Agent": "Mozilla/5.0 (compatible; VCryptoScope/1.0)"
          }

          def get_url(url, timeout=20):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=timeout) as response:
                  return response.read()

          def clean_text(value):
              value = unescape(value or "")
              value = re.sub(r"<[^>]+>", " ", value)
              return re.sub(r"\s+", " ", value).strip()

          def extract_article_text(url):
              """Resolve Google News RSS wrappers and extract genuine publisher article text."""
              import html
              pages = []
              candidate_urls = []
              if url:
                  candidate_urls.append(url)

              def add_url(value):
                  value = html.unescape(value or "").replace("\\/", "/").replace("&amp;", "&")
                  value = value.strip(" <>")
                  parsed = urllib.parse.urlparse(value)
                  if parsed.scheme in ("http", "https") and parsed.netloc and "news.google.com" not in parsed.netloc and "google.com" not in parsed.netloc:
                      if value not in candidate_urls:
                          candidate_urls.insert(0, value)

              # Google News RSS links often return a wrapper page rather than redirecting.
              try:
                  request = urllib.request.Request(url, headers=HEADERS)
                  with urllib.request.urlopen(request, timeout=25) as response:
                      raw = response.read().decode("utf-8", errors="ignore")
                      final_url = response.geturl()
                  pages.append(raw)
                  add_url(final_url)
                  # Publisher links may be embedded in the Google News wrapper as escaped URLs.
                  for match in re.findall(r"https?:(?:\\/\\/|//)[^\\s\"'<>\\\\]+", raw):
                      add_url(match)
                  for pattern in (
                      r"href=[\"'](https?://[^\"']+)[\"']",
                      r"(?:url|article_url|canonical_url)[\"']?\\s*[:=]\\s*[\"'](https?://[^\"']+)",
                  ):
                      for match in re.findall(pattern, raw, re.I):
                          add_url(match)
              except Exception as exc:
                  print(f"Google News wrapper fetch error: {exc}")

              # Fetch candidate publisher URLs and extract only substantial article bodies.
              try:
                  import trafilatura
                  for candidate_url in candidate_urls[:12]:
                      try:
                          downloaded = trafilatura.fetch_url(candidate_url)
                          if downloaded:
                              pages.append(downloaded)
                              extracted = clean_text(trafilatura.extract(
                                  downloaded, include_comments=False,
                                  include_tables=False, favor_recall=True,
                                  output_format="txt"
                              ) or "")
                              if len(extracted) >= 500:
                                  return extracted[:6000]
                      except Exception as exc:
                          print(f"Publisher fetch failed for {candidate_url[:120]}: {exc}")
              except Exception as exc:
                  print(f"Trafilatura extraction error: {exc}")

              # Structured metadata is often available even when readability extraction fails.
              for page in pages:
                  for match in re.findall(r'"articleBody"\\s*:\\s*"((?:\\\\.|[^"\\\\])*)"', page, re.I):
                      try:
                          decoded = clean_text(json.loads('"' + match + '"'))
                          if len(decoded) >= 500:
                              return decoded[:6000]
                      except Exception:
                          pass

              # Last fallback: article/main paragraphs, excluding Google News navigation and boilerplate.
              for page in pages:
                  main_match = re.search(r'<(?:article|main)\\b[^>]*>(.*?)</(?:article|main)>', page, re.I | re.S)
                  fragment = main_match.group(1) if main_match else page
                  fragment = re.sub(r'<(script|style|nav|footer|header|aside)\\b[^>]*>.*?</\\1>', ' ', fragment, flags=re.I | re.S)
                  paragraphs = re.findall(r'<p\\b[^>]*>(.*?)</p>', fragment, re.I | re.S)
                  text = clean_text(' '.join(paragraphs))
                  if len(text) >= 500 and "Google News" not in text[:100]:
                      return text[:6000]
              return ""

          def translate_tr(text):
              if not text:
                  return ""
              try:
                  query = urllib.parse.urlencode({
                      "client": "gtx",
                      "sl": "auto",
                      "tl": "tr",
                      "dt": "t",
                      "q": text[:4000],
                  })
                  url = (
                      "https://translate.googleapis.com/translate_a/single?"
                      + query
                  )
                  data = json.loads(get_url(url).decode("utf-8"))
                  return "".join(
                      part[0] for part in data[0] if part and part[0]
                  ).strip() or text
              except Exception as exc:
                  print(f"Translation error: {exc}")
                  return text

          def published_date(value):
              if not value:
                  return datetime.now(timezone.utc).isoformat()
              try:
                  dt = parsedate_to_datetime(value)
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  return dt.astimezone(timezone.utc).isoformat()
              except Exception:
                  return datetime.now(timezone.utc).isoformat()

          def classify_importance(title, summary, category):
              text = (title + " " + summary).lower()
              high_words = [
                  "rate decision", "interest rate", "fed", "fomc",
                  "inflation", "cpi", "pce", "jobs report", "nonfarm",
                  "unemployment", "opec", "oil supply", "sec approves",
                  "etf approval", "recession", "emergency", "crash",
                  "surge", "record high", "sanction"
              ]
              medium_words = [
                  "forecast", "outlook", "earnings", "fund flows",
                  "treasury", "yield", "brent", "wti", "regulation",
                  "economic growth", "dollar index"
              ]
              if any(word in text for word in high_words):
                  return "Yüksek"
              if category in ("Fed & Faiz", "İstihdam & Enflasyon"):
                  return "Orta"
              if any(word in text for word in medium_words):
                  return "Orta"
              return "Normal"

          def infer_impact(category):
              impacts = {
                  "Kripto": "Kripto fiyatları, fon akışları ve risk iştahı üzerindeki olası etkileri takip edin.",
                  "Fed & Faiz": "Faiz beklentileri dolar, tahvil getirileri, hisse senetleri ve kripto varlıkları etkileyebilir.",
                  "İstihdam & Enflasyon": "Veri, Fed'in faiz politikası ve piyasalardaki risk iştahı için önemli olabilir.",
                  "Petrol & Enerji": "Petrol fiyatları enflasyon beklentilerini, enerji şirketlerini ve küresel büyümeyi etkileyebilir.",
                  "Regülasyon": "Düzenleyici kararlar kripto varlıklara erişimi ve kurumsal yatırımları etkileyebilir.",
                  "Küresel Piyasalar": "Dolar, tahvil getirileri ve küresel risk iştahındaki değişimler farklı piyasalara yansıyabilir.",
              }
              return impacts.get(category, "")

          items = []
          seen = set()
          extraction_stats = {"attempted": 0, "success": 0, "sentences": 0}

          for category, queries in FEEDS.items():
              category_items = []

              for source_name, rss_url in queries:
                  try:
                      root = ET.fromstring(get_url(rss_url))
                      nodes = root.findall(".//item")
                      if not nodes:
                          nodes = root.findall(".//{*}entry")

                      for node in nodes:
                          title = clean_text(node.findtext("title", ""))
                          summary = clean_text(
                              node.findtext("description", "")
                              or node.findtext("{*}summary", "")
                              or node.findtext("{*}content", "")
                          )
                          link_node = node.find("link")
                          url = ""
                          if link_node is not None:
                              url = (link_node.text or link_node.attrib.get("href", "") or "").strip()
                          published = published_date(
                              node.findtext("pubDate", "")
                              or node.findtext("{*}published", "")
                              or node.findtext("{*}updated", "")
                          )

                          if not title or not url:
                              continue
                          if url.startswith("/"):
                              continue

                          key = url.split("?utm_")[0].strip()
                          if key in seen:
                              continue
                          seen.add(key)

                          category_items.append({
                              "title": title,
                              "summary": summary,
                              "url": url,
                              "source": source_name,
                              "publishedAt": published,
                              "category": category,
                          })

                  except Exception as exc:
                      print(f"Direct publisher feed error [{category}] [{source_name} {rss_url}]: {exc}")

                  time.sleep(0.3)

              category_items.sort(
                  key=lambda item: item["publishedAt"],
                  reverse=True
              )

              for item in category_items[:12]:
                  print("Translating:", item["title"][:100])
                  item["titleTr"] = translate_tr(item["title"])
                  item["summaryTr"] = translate_tr(item["summary"])
                  extraction_stats["attempted"] += 1
                  article_text = extract_article_text(item["url"])
                  # Publish only real publisher text; never pad a headline with generic prose.
                  if article_text and len(article_text) > len(item["title"]) + 250:
                      translated = translate_tr(article_text[:5000])
                      item["articleText"] = article_text[:6000]
                      item["articleTextTr"] = translated[:6500]
                      sentence_count = len(re.findall(r"[^.!?]+[.!?]+", translated))
                      extraction_stats["success"] += 1
                      extraction_stats["sentences"] += sentence_count
                      print(f"ARTICLE TEXT OK: {item['source']} | chars={len(translated)} | sentences={sentence_count} | {item['title'][:90]}")
                  else:
                      item["articleText"] = ""
                      item["articleTextTr"] = ""
                      print(f"ARTICLE TEXT MISSING: {item['source']} | {item['title'][:90]}")
                  item["importance"] = classify_importance(
                      item["title"], item["summary"], category
                  )
                  item["marketImpactTr"] = infer_impact(category)
                  items.append(item)
                  time.sleep(0.15)

          items.sort(
              key=lambda item: item["publishedAt"],
              reverse=True
          )
          items = items[:72]

          output = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "count": len(items),
              "articles": items,
              "news": items,
              "items": items,
          }

          with open("news.json", "w", encoding="utf-8") as file:
              json.dump(output, file, ensure_ascii=False, indent=2)

          print(f"Saved {len(items)} news items.")
          print(f"ARTICLE EXTRACTION SUMMARY: {extraction_stats['success']}/{extraction_stats['attempted']} articles with body; translated sentences total={extraction_stats['sentences']}.")
          if extraction_stats["attempted"] and extraction_stats["success"] == 0:
              print("WARNING: No publisher article bodies were extracted; do not treat summaries as full articles.")
          print("Categories:", ", ".join(FEEDS.keys()))
          PY

      - name: Commit and push updated news
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add news.json

          if git diff --cached --quiet; then
            echo "No news changes to commit."
            exit 0
          fi

          git commit -m "Update market news"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
