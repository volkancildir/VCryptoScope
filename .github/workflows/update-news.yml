name: Update Crypto News

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch crypto news
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime

          feeds = [
              ("Google News", "https://news.google.com/rss/search?q=cryptocurrency+OR+Bitcoin+OR+Ethereum&hl=en-US&gl=US&ceid=US:en"),
          ]

          articles = []
          seen = set()

          for source, url in feeds:
              try:
                  request = urllib.request.Request(
                      url,
                      headers={"User-Agent": "Mozilla/5.0 VCryptoScope/1.0"}
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      root = ET.fromstring(response.read())

                  for item in root.findall(".//item"):
                      title = item.findtext("title", "").strip()
                      link = item.findtext("link", "").strip()
                      pub_date = item.findtext("pubDate", "").strip()

                      if not title or not link or link in seen:
                          continue

                      seen.add(link)
                      published = None
                      try:
                          published = parsedate_to_datetime(pub_date).isoformat()
                      except Exception:
                          pass

                      articles.append({
                          "title": title,
                          "url": link,
                          "source": source,
                          "publishedAt": published
                      })
              except Exception as error:
                  print(f"Feed error: {error}")

          articles = articles[:100]

          if not articles:
              raise SystemExit("No news received; keeping the existing news.json.")

          data = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "articles": articles
          }

          with open("news.json", "w", encoding="utf-8") as file:
              json.dump(data, file, ensure_ascii=False, indent=2)

          print(f"Saved {len(articles)} news articles.")
          PY

      - name: Commit updated news
        run: |
          if git diff --quiet -- news.json; then
            echo "No news changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update crypto news"
          git push
          
