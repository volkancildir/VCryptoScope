name: Update Crypto News

on:
workflow_dispatch:
schedule:
- cron: "7,22,37,52 * * * *"

permissions:
contents: write

jobs:
update-news:
runs-on: ubuntu-latest
timeout-minutes: 10

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Fetch, translate and classify news
    run: |
      python - <<'PY'
      import json
      import re
      import time
      import urllib.request
      import urllib.parse
      import xml.etree.ElementTree as ET
      from datetime import datetime, timezone
      from email.utils import parsedate_to_datetime
      from html import unescape

      # İngilizce haber kaynakları; mevcut otomatik çalışma sıklığı korunur.
      queries = [
          ("Kripto", "Bitcoin OR Ethereum OR cryptocurrency OR altcoin OR blockchain"),
          ("Kripto Piyasası", "crypto market OR digital assets OR cryptocurrency market"),
          ("Fed & Faiz", "Federal Reserve OR FOMC OR interest rates OR Jerome Powell"),
          ("İstihdam & Enflasyon", "US inflation OR CPI OR PCE OR US jobs report OR unemployment OR payrolls"),
          ("Petrol & Enerji", "oil prices OR crude oil OR OPEC OR natural gas OR energy markets"),
          ("Regülasyon", "cryptocurrency regulation OR SEC crypto OR crypto legislation OR crypto lawsuit"),
          ("Küresel Piyasalar", "global markets OR US dollar OR Treasury yields OR stock markets OR bond yields"),
          ("Kurumsal Yatırım", "Bitcoin ETF OR Ethereum ETF OR institutional crypto investment"),
      ]

      feeds = [
          (
              source,
              "https://news.google.com/rss/search?"
              + urllib.parse.urlencode({
                  "q": query,
                  "hl": "en-US",
                  "gl": "US",
                  "ceid": "US:en"
              })
          )
          for source, query in queries
      ]

      def clean_html(value):
          value = re.sub(r"<[^>]+>", " ", value or "")
          return re.sub(r"\s+", " ", unescape(value)).strip()

      def translate_tr(text):
          if not text:
              return ""
          try:
              params = urllib.parse.urlencode({
                  "client": "gtx",
                  "sl": "auto",
                  "tl": "tr",
                  "dt": "t",
                  "q": text[:3000]
              })
              url = "https://translate.googleapis.com/translate_a/single?" + params
              request = urllib.request.Request(
                  url, headers={"User-Agent": "Mozilla/5.0"}
              )
              with urllib.request.urlopen(request, timeout=12) as response:
                  result = json.loads(response.read().decode("utf-8"))
              translated = "".join(
                  part[0] for part in result[0] if part and part[0]
              )
              return translated or text
          except Exception as error:
              print(f"Translation fallback: {error}")
              return text

      def classify(text, feed_category):
          t = text.lower()

          critical = [
              "hack", "hacked", "exploit", "bankruptcy",
              "collapse", "emergency", "liquidation", "market crash",
              "crashes", "bans crypto", "war breaks out",
              "exchange insolvency"
          ]

          high = [
              "federal reserve", "fomc", "interest rate",
              "rate cut", "rate hike", "inflation", "cpi",
              "jobs report", "unemployment", "payrolls",
              "oil prices", "crude oil", "opec", "sanctions",
              "regulation", "legislation", "lawsuit", "approval",
              "rejection", "sec", "etf", "treasury yields",
              "bitcoin", "ethereum"
          ]

          medium = [
              "forecast", "prediction", "upgrade", "partnership",
              "adoption", "investment", "fund", "launch",
              "natural gas", "employment", "economic growth",
              "market outlook"
          ]

          if any(word in t for word in critical):
              importance = "KRİTİK"
          elif any(word in t for word in high):
              importance = "YÜKSEK"
          elif any(word in t for word in medium):
              importance = "ORTA"
          else:
              importance = "DÜŞÜK"

          # Daha özel konular genel kripto kategorilerinden önce değerlendirilir.
          if any(w in t for w in [
              "crude oil", "oil prices", "brent", "wti",
              "opec", "natural gas", "energy market",
              "energy prices", "petroleum"
          ]):
              category = "Petrol & Enerji"

          elif any(w in t for w in [
              "federal reserve", "fomc", "jerome powell",
              "interest rate", "rate cut", "rate hike",
              "monetary policy", "central bank", "fed funds"
          ]):
              category = "Fed & Faiz"

          elif any(w in t for w in [
              "inflation", "consumer price index", "cpi",
              "pce", "payrolls", "unemployment", "jobs report",
              "employment report", "jobless claims",
              "nonfarm payroll", "labor market", "labour market"
          ]):
              category = "İstihdam & Enflasyon"

          elif any(w in t for w in [
              "regulation", "regulatory", "legislation",
              "lawsuit", "court ruling", "legal framework",
              "banned crypto", "crypto ban", "sec enforcement",
              "crypto law", "mica regulation"
          ]):
              category = "Regülasyon"

          elif any(w in t for w in [
              "bitcoin", "btc"
          ]):
              category = "Bitcoin"

          elif any(w in t for w in [
              "ethereum", "ether", " eth "
          ]):
              category = "Ethereum"

          elif any(w in t for w in [
              "etf", "institutional investment",
              "institutional investor", "asset manager"
          ]):
              category = "Kurumsal Yatırım"

          elif any(w in t for w in [
              "global markets", "stock market", "stock markets",
              "treasury yields", "bond yields", "us dollar",
              "dollar index", "wall street", "equity markets",
              "market selloff", "market rally"
          ]):
              category = "Küresel Piyasalar"

          else:
              category = feed_category

          impacts = {
              "KRİTİK": "Potansiyel olarak çok yüksek etki. Haber ve kaynak doğrulanmalıdır.",
              "YÜKSEK": "Piyasaları veya ilgili varlıkları önemli ölçüde etkileyebilir.",
              "ORTA": "İlgili varlıklarda orta düzeyde etki oluşturabilir.",
              "DÜŞÜK": "Doğrudan piyasa etkisi sınırlı veya henüz belirsiz."
          }

          return importance, category, impacts[importance]

      articles = []
      seen = set()

      for source, url in feeds:
          try:
              request = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0 VCryptoScope/1.0"}
              )

              with urllib.request.urlopen(request, timeout=20) as response:
                  root = ET.fromstring(response.read())

              feed_category = source

              for item in root.findall(".//item"):
                  title = clean_html(item.findtext("title", ""))
                  link = item.findtext("link", "").strip()
                  description = clean_html(item.findtext("description", ""))
                  pub_date = item.findtext("pubDate", "").strip()

                  if not title or not link or link in seen:
                      continue

                  seen.add(link)

                  published = None
                  try:
                      published = parsedate_to_datetime(
                          pub_date
                      ).astimezone(timezone.utc).isoformat()
                  except Exception:
                      pass

                  importance, category, impact = classify(
                      title + " " + description, feed_category
                  )

                  articles.append({
                      "title": title,
                      "titleTr": title,
                      "summary": description,
                      "summaryTr": description,
                      "url": link,
                      "source": "Google News",
                      "publishedAt": published,
                      "importance": importance,
                      "category": category,
                      "marketImpactTr": impact
                  })

              print(f"Feed completed: {source}")

          except Exception as error:
              print(f"Feed error ({source}): {error}")

      if not articles:
          raise SystemExit(
              "No news received; existing news.json preserved."
          )

      articles.sort(
          key=lambda item: item.get("publishedAt") or "",
          reverse=True
      )

      # Her kategorinin haber akışında yer bulmasını kolaylaştır.
      # Önce kategorilere göre en yeni haberleri seç, sonra kalan alanı doldur.
      selected = []
      selected_links = set()
      categories = [
          "Bitcoin",
          "Ethereum",
          "Kripto Piyasası",
          "Fed & Faiz",
          "İstihdam & Enflasyon",
          "Petrol & Enerji",
          "Regülasyon",
          "Küresel Piyasalar",
          "Kurumsal Yatırım"
      ]

      for category in categories:
          matches = [
              a for a in articles
              if a["category"] == category
          ]
          for article in matches[:6]:
              if article["url"] not in selected_links:
                  selected.append(article)
                  selected_links.add(article["url"])

      for article in articles:
          if len(selected) >= 50:
              break
          if article["url"] not in selected_links:
              selected.append(article)
              selected_links.add(article["url"])

      selected.sort(
          key=lambda item: item.get("publishedAt") or "",
          reverse=True
      )
      articles = selected[:50]

      for index, article in enumerate(articles):
          article["titleTr"] = translate_tr(article["title"])
          article["summaryTr"] = translate_tr(article["summary"])
          print(f"Translated {index + 1}/{len(articles)}")
          time.sleep(0.15)

      data = {
          "updatedAt": datetime.now(timezone.utc).isoformat(),
          "articles": articles
      }

      with open("news.json", "w", encoding="utf-8") as file:
          json.dump(data, file, ensure_ascii=False, indent=2)

      print(f"Saved {len(articles)} translated and classified articles.")
      print("Category counts:")
      for category in categories:
          count = sum(
              1 for article in articles
              if article["category"] == category
          )
          print(f"  {category}: {count}")

      PY

  - name: Commit updated news
    run: |
      if git diff --quiet -- news.json; then
        echo "No news changes."
        exit 0
      fi

      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      git add news.json
      git commit -m "Update crypto news"
      git push
