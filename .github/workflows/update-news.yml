name: Update Crypto News

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch, translate and classify news
        run: |
          python - <<'PY'
          import json
          import re
          import time
          import urllib.request
          import urllib.parse
          import xml.etree.ElementTree as ET
          from datetime import datetime, timezone
          from email.utils import parsedate_to_datetime
          from html import unescape

          feeds = [
              ("Crypto", "https://news.google.com/rss/search?q=Bitcoin+OR+Ethereum+OR+cryptocurrency&hl=en-US&gl=US&ceid=US:en"),
              ("Markets", "https://news.google.com/rss/search?q=crypto+market+OR+Bitcoin+ETF+OR+crypto+regulation&hl=en-US&gl=US&ceid=US:en"),
              ("Economy", "https://news.google.com/rss/search?q=Federal+Reserve+OR+inflation+OR+interest+rates+AND+Bitcoin&hl=en-US&gl=US&ceid=US:en"),
          ]

          def clean_html(value):
              value = re.sub(r"<[^>]+>", " ", value or "")
              return re.sub(r"\s+", " ", unescape(value)).strip()

          def translate_tr(text):
              if not text:
                  return ""
              try:
                  params = urllib.parse.urlencode({
                      "client": "gtx",
                      "sl": "auto",
                      "tl": "tr",
                      "dt": "t",
                      "q": text[:3000]
                  })
                  url = "https://translate.googleapis.com/translate_a/single?" + params
                  request = urllib.request.Request(
                      url, headers={"User-Agent": "Mozilla/5.0"}
                  )
                  with urllib.request.urlopen(request, timeout=12) as response:
                      result = json.loads(response.read().decode("utf-8"))
                  translated = "".join(
                      part[0] for part in result[0] if part and part[0]
                  )
                  return translated or text
              except Exception as error:
                  print(f"Translation fallback: {error}")
                  return text

          def classify(text):
              t = text.lower()

              critical = [
                  "hack", "hacked", "exploit", "bankruptcy",
                  "collapse", "secures", "war", "emergency",
                  "liquidation", "crash", "bans crypto"
              ]
              high = [
                  "sec", "etf", "fed", "interest rate", "inflation",
                  "regulation", "lawsuit", "approval", "rejection",
                  "reserve", "bitcoin", "ethereum", "sanction"
              ]
              medium = [
                  "forecast", "prediction", "upgrade", "partnership",
                  "adoption", "investment", "fund", "launch"
              ]

              if any(word in t for word in critical):
                  importance = "KRİTİK"
              elif any(word in t for word in high):
                  importance = "YÜKSEK"
              elif any(word in t for word in medium):
                  importance = "ORTA"
              else:
                  importance = "DÜŞÜK"

              if any(w in t for w in ["bitcoin", "btc"]):
                  category = "Bitcoin"
              elif any(w in t for w in ["ethereum", "ether", "eth"]):
                  category = "Ethereum"
              elif any(w in t for w in ["sec", "regulation", "lawsuit", "law", "ban"]):
                  category = "Regülasyon"
              elif any(w in t for w in ["fed", "inflation", "interest rate", "economy"]):
                  category = "Makroekonomi"
              elif any(w in t for w in ["etf", "fund", "institutional"]):
                  category = "Kurumsal Yatırım"
              else:
                  category = "Kripto Piyasası"

              impact = {
                  "KRİTİK": "Potansiyel olarak çok yüksek etki. Haberin doğrulanması gerekir.",
                  "YÜKSEK": "Piyasa oynaklığını artırabilecek önemli gelişme.",
                  "ORTA": "İlgili varlıklarda sınırlı veya orta düzeyde etki oluşturabilir.",
                  "DÜŞÜK": "Doğrudan piyasa etkisi belirsiz veya sınırlı."
              }[importance]

              return importance, category, impact

          articles = []
          seen = set()

          for source, url in feeds:
              try:
                  request = urllib.request.Request(
                      url, headers={"User-Agent": "Mozilla/5.0 VCryptoScope/1.0"}
                  )
                  with urllib.request.urlopen(request, timeout=20) as response:
                      root = ET.fromstring(response.read())

                  for item in root.findall(".//item"):
                      title = clean_html(item.findtext("title", ""))
                      link = item.findtext("link", "").strip()
                      description = clean_html(item.findtext("description", ""))
                      pub_date = item.findtext("pubDate", "").strip()

                      if not title or not link or link in seen:
                          continue

                      seen.add(link)
                      published = None
                      try:
                          published = parsedate_to_datetime(pub_date).isoformat()
                      except Exception:
                          pass

                      importance, category, impact = classify(
                          title + " " + description
                      )

                      articles.append({
                          "title": title,
                          "titleTr": title,
                          "summary": description,
                          "summaryTr": description,
                          "url": link,
                          "source": source,
                          "publishedAt": published,
                          "importance": importance,
                          "category": category,
                          "marketImpactTr": impact
                      })
              except Exception as error:
                  print(f"Feed error ({source}): {error}")

          if not articles:
              raise SystemExit("No news received; existing news.json preserved.")

          articles.sort(
              key=lambda item: item.get("publishedAt") or "",
              reverse=True
          )
          articles = articles[:50]

          for index, article in enumerate(articles):
              article["titleTr"] = translate_tr(article["title"])
              article["summaryTr"] = translate_tr(article["summary"])
              print(f"Translated {index + 1}/{len(articles)}")
              time.sleep(0.15)

          data = {
              "updatedAt": datetime.now(timezone.utc).isoformat(),
              "articles": articles
          }

          with open("news.json", "w", encoding="utf-8") as file:
              json.dump(data, file, ensure_ascii=False, indent=2)

          print(f"Saved {len(articles)} translated and classified articles.")
          PY

      - name: Commit updated news
        run: |
          if git diff --quiet -- news.json; then
            echo "No news changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update crypto news"
          git push
          
