
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VCryptoScope | Kripto Haberleri</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#0b1020;color:#e8edf7;font-family:Arial,sans-serif}
header{padding:24px 16px;background:#111a2e;border-bottom:1px solid #26334d}
.container{max-width:1050px;margin:auto}
h1{margin:0 0 8px;font-size:25px}
.subtitle{color:#9eabc3;font-size:13px}
main{max-width:1050px;margin:auto;padding:18px 14px}
#search{width:100%;padding:13px;border-radius:10px;border:1px solid #2c3b57;background:#111a2e;color:#fff;font-size:15px;margin-bottom:14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
.filters button{border:1px solid #33415c;background:#141e33;color:#c8d3e7;padding:10px 13px;border-radius:9px;font-size:13px;cursor:pointer}
.filters button.active{background:#2563eb;border-color:#3b82f6;color:white}
#status{color:#9eabc3;font-size:13px;margin:12px 0}
.article{background:#111a2e;border:1px solid #26334d;border-radius:12px;padding:16px;margin-bottom:12px}
.article h2{font-size:17px;line-height:1.45;margin:0 0 10px}
.article h2 a{color:#edf3ff;text-decoration:none}
.article h2 a:hover{color:#60a5fa}
.summary{font-size:14px;line-height:1.6;color:#bac6da;margin:0 0 12px}
.meta{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:#8494af}
.category{color:#7dd3fc}
.empty{padding:28px;text-align:center;color:#9eabc3;background:#111a2e;border-radius:12px}
footer{text-align:center;padding:24px;color:#65738b;font-size:12px}
</style>
</head>
<body>
<header>
  <div class="container">
    <h1>VCryptoScope</h1>
    <div class="subtitle">Kripto piyasaları ve küresel ekonomi haberleri</div>
  </div>
</header>

<main>
  <input id="search" type="search" placeholder="Haber ara...">

  <div class="filters" id="filters">
    <button class="active" data-category="Tümü">Tüm Haberler</button>
    <button data-category="Bitcoin">Bitcoin</button>
    <button data-category="Ethereum">Ethereum</button>
    <button data-category="Makroekonomi">Makroekonomi</button>
    <button data-category="Regülasyon">Regülasyon</button>
    <button data-category="Kurumsal Yatırım">Kurumsal Yatırım</button>
    <button data-category="Kripto Piyasası">Kripto Piyasası</button>
  </div>

  <div id="status">Haberler yükleniyor...</div>
  <div id="articles"></div>
</main>

<footer>VCryptoScope · Bilgilendirme amaçlıdır, yatırım tavsiyesi değildir.</footer>

<script>
const list = document.getElementById("articles");
const statusBox = document.getElementById("status");
const searchBox = document.getElementById("search");
const filterButtons = [...document.querySelectorAll("#filters button")];

let allArticles = [];
let selectedCategory = "Tümü";

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",
    '"':"&quot;","'":"&#39;"
  }[char]));
}

function dateText(value) {
  if (!value) return "Tarih bilinmiyor";
  const date = new Date(value);
  if (Number.isNaN(date.getTime())) return "Tarih bilinmiyor";
  return date.toLocaleString("tr-TR", {
    dateStyle:"medium", timeStyle:"short"
  });
}

function render() {
  const query = searchBox.value.trim().toLocaleLowerCase("tr-TR");

  const filtered = allArticles.filter(article => {
    const category = article.category || "Kripto Piyasası";
    const title = article.titleTr || article.title || "";
    const summary = article.summaryTr || article.summary || article.description || "";

    const matchesCategory =
      selectedCategory === "Tümü" || category === selectedCategory;

    const matchesSearch =
      (title + " " + summary + " " + category)
      .toLocaleLowerCase("tr-TR").includes(query);

    return matchesCategory && matchesSearch;
  });

  statusBox.textContent = `${filtered.length} haber gösteriliyor`;

  if (!filtered.length) {
    list.innerHTML = '<div class="empty">Bu kategoride haber bulunamadı.</div>';
    return;
  }

  list.innerHTML = filtered.map(article => {
    const title = article.titleTr || article.title || "Başlıksız haber";
    const summary = article.summaryTr || article.summary || article.description || "";
    const category = article.category || "Kripto Piyasası";
    const url = article.url || "#";

    return `
      <article class="article">
        <h2><a href="${escapeHTML(url)}" target="_blank" rel="noopener noreferrer">${escapeHTML(title)}</a></h2>
        ${summary ? `<p class="summary">${escapeHTML(summary)}</p>` : ""}
        <div class="meta">
          <span class="category">${escapeHTML(category)}</span>
          <span>${escapeHTML(article.source || "Haber kaynağı")}</span>
          <span>${escapeHTML(dateText(article.publishedAt))}</span>
        </div>
      </article>`;
  }).join("");
}

filterButtons.forEach(button => {
  button.addEventListener("click", () => {
    selectedCategory = button.dataset.category;
    filterButtons.forEach(item =>
      item.classList.toggle("active", item === button)
    );
    render();
  });
});

searchBox.addEventListener("input", render);

async function loadNews() {
  try {
    const response = await fetch("./news.json?update=" + Date.now(), {
      cache:"no-store"
    });
    if (!response.ok) throw new Error("HTTP " + response.status);

    const data = await response.json();
    allArticles = Array.isArray(data) ? data : (data.articles || data.items || []);

    if (!allArticles.length) {
      statusBox.textContent = "Henüz haber bulunamadı.";
      list.innerHTML = "";
      return;
    }

    render();
  } catch (error) {
    statusBox.textContent = "Haberler yüklenemedi. Lütfen sayfayı yenileyin.";
    console.error(error);
  }
}

loadNews();
</script>
</body>
</html>
