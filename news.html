
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kripto Haberleri | VCryptoScope</title>

<style>
:root {
  --bg: #080d18;
  --panel: #111a2b;
  --border: #26334a;
  --text: #e8eef8;
  --muted: #8c9bb2;
  --accent: #38bdf8;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  padding: 20px;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, sans-serif;
}

.container {
  max-width: 1050px;
  margin: auto;
}

h1 { margin-bottom: 6px; }

.subtitle {
  color: var(--muted);
  margin-top: 0;
  margin-bottom: 24px;
}

.toolbar {
  display: flex;
  flex-wrap: wrap;
  gap: 10px;
  margin-bottom: 16px;
}

input, select, #refreshButton {
  background: var(--panel);
  color: var(--text);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px;
  font-size: 14px;
}

input {
  flex: 1;
  min-width: 180px;
}

select { max-width: 100%; }

#refreshButton {
  background: #123653;
  color: #7dd3fc;
  border-color: var(--accent);
  cursor: pointer;
  white-space: nowrap;
}

#refreshButton:disabled {
  opacity: .6;
  cursor: wait;
}

.filters {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin: 18px 0;
}

.filters button {
  border: 1px solid var(--border);
  background: var(--panel);
  color: var(--text);
  padding: 9px 13px;
  border-radius: 20px;
  cursor: pointer;
}

.filters button.active {
  background: #123653;
  border-color: var(--accent);
  color: #7dd3fc;
}

.status {
  color: var(--muted);
  margin: 14px 0;
  font-size: 13px;
}

.news-card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 18px;
  margin-bottom: 13px;
}

.card-top {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-bottom: 12px;
}

.tag {
  display: inline-block;
  font-size: 11px;
  font-weight: bold;
  letter-spacing: .4px;
  border-radius: 5px;
  padding: 5px 8px;
}

.critical { background: #491b26; color: #ff8294; }
.high { background: #4a2b16; color: #ffb36b; }
.medium { background: #453b16; color: #f9df70; }
.low { background: #163d30; color: #76e4b1; }
.category-tag { background: #1b2c44; color: #9dcaff; }

.meta {
  color: var(--muted);
  font-size: 12px;
}

.news-card h2 {
  font-size: 18px;
  line-height: 1.5;
  margin: 0 0 10px;
}

.news-card p {
  color: #b9c6d9;
  line-height: 1.65;
  font-size: 14px;
  margin: 0 0 12px;
}

.market-impact {
  border-left: 3px solid var(--accent);
  padding: 8px 11px;
  margin: 12px 0;
  background: #0c1728;
  color: #c5d8ee;
  font-size: 13px;
  line-height: 1.6;
}

.read-link {
  color: var(--accent);
  text-decoration: none;
  font-size: 13px;
  font-weight: bold;
}

.read-link:hover { text-decoration: underline; }

.empty {
  padding: 28px;
  text-align: center;
  color: var(--muted);
  border: 1px dashed var(--border);
  border-radius: 12px;
}

@media (max-width: 600px) {
  body { padding: 14px; }
  .news-card { padding: 14px; }
  .news-card h2 { font-size: 16px; }
  .toolbar > * { max-width: 100%; }
  input { width: 100%; }
}
</style>
</head>

<body>
<div class="container">
  <h1>Kripto Haberleri</h1>
  <p class="subtitle">
    Kripto piyasası, ekonomi ve dijital varlık gündemi
  </p>

  <div class="toolbar">
    <input
      id="searchInput"
      type="search"
      placeholder="Haber, kaynak veya kelime ara..."
      aria-label="Haberlerde ara"
    >

    <select id="sortSelect" aria-label="Haber sıralaması">
      <option value="dateImportance">Tarih ve önem sırasına göre</option>
      <option value="newest">En yeni tarih önce</option>
      <option value="importance">Önem seviyesi önce</option>
      <option value="oldest">En eski tarih önce</option>
    </select>

    <button id="refreshButton" type="button">
      ↻ Haberleri Yenile
    </button>
  </div>

  <!-- Önem seviyeleri filtrelerde değil, haber kartlarında gösterilir. -->
  <div class="filters" id="filters">
    <button type="button" class="active" data-category="Tümü" aria-pressed="true">Tüm Haberler</button>
    <button type="button" data-category="Bitcoin" aria-pressed="false">Bitcoin</button>
    <button type="button" data-category="Ethereum" aria-pressed="false">Ethereum</button>
    <button type="button" data-category="Makroekonomi" aria-pressed="false">Makroekonomi</button>
    <button type="button" data-category="Regülasyon" aria-pressed="false">Regülasyon</button>
    <button type="button" data-category="Kurumsal Yatırım" aria-pressed="false">Kurumsal Yatırım</button>
    <button type="button" data-category="Kripto Piyasası" aria-pressed="false">Kripto Piyasası</button>
  </div>

  <div id="status" class="status">Haberler yükleniyor...</div>
  <div id="newsList"></div>
</div>

<script>
(() => {
  "use strict";

  const newsList = document.getElementById("newsList");
  const status = document.getElementById("status");
  const searchInput = document.getElementById("searchInput");
  const sortSelect = document.getElementById("sortSelect");
  const filters = document.getElementById("filters");
  const refreshButton = document.getElementById("refreshButton");

  let allArticles = [];
  let selectedCategory = "Tümü";
  let refreshInProgress = false;

  const importanceOrder = {
    "KRİTİK": 4,
    "KRITIK": 4,
    "YÜKSEK": 3,
    "YUKSEK": 3,
    "ORTA": 2,
    "DÜŞÜK": 1,
    "DUSUK": 1
  };

  function getText(article, keys) {
    for (const key of keys) {
      const value = article[key];
      if (typeof value === "string" && value.trim()) {
        return value.trim();
      }
    }
    return "";
  }

  function getTitle(article) {
    return getText(article, [
      "titleTr", "title_tr", "translatedTitle", "title"
    ]) || "Başlıksız haber";
  }

  function getSummary(article) {
    return getText(article, [
      "summaryTr", "summary_tr", "descriptionTr",
      "summary", "description"
    ]);
  }

  function getImportance(article) {
    const raw = getText(article, [
      "importance", "importanceLevel",
      "importance_level", "priority", "severity"
    ]).toLocaleUpperCase("tr-TR");

    if (raw.includes("KRİTİK") || raw.includes("KRITIK")) return "KRİTİK";
    if (raw.includes("YÜKSEK") || raw.includes("YUKSEK")) return "YÜKSEK";
    if (raw.includes("ORTA")) return "ORTA";
    if (raw.includes("DÜŞÜK") || raw.includes("DUSUK")) return "DÜŞÜK";

    return "ORTA";
  }

  function getCategory(article) {
    const explicit = getText(article, ["category", "kategori"]);
    const known = [
      "Bitcoin", "Ethereum", "Makroekonomi",
      "Regülasyon", "Kurumsal Yatırım", "Kripto Piyasası"
    ];

    if (known.includes(explicit)) return explicit;

    const text = (
      getTitle(article) + " " + getSummary(article)
    ).toLocaleLowerCase("tr-TR");

    if (/\b(bitcoin|btc)\b/.test(text)) return "Bitcoin";
    if (/\b(ethereum|ether|eth)\b/.test(text)) return "Ethereum";

    if (/regülasyon|regulasyon|yasal düzenleme|yasak|mahkeme|mevzuat|\bsec\b/.test(text)) {
      return "Regülasyon";
    }

    if (/fed\b|faiz|enflasyon|merkez bankası|merkez bankasi|istihdam|dolar endeksi|makroekonomi/.test(text)) {
      return "Makroekonomi";
    }

    if (/kurumsal yatırım|kurumsal yatirim|etf|fon girişi|fon girisi|şirket alımı|sirket alimi/.test(text)) {
      return "Kurumsal Yatırım";
    }

    return "Kripto Piyasası";
  }

  function getDate(article) {
    const raw = getText(article, [
      "publishedAt", "published_at", "date", "pubDate"
    ]);

    const parsed = raw ? Date.parse(raw) : NaN;
    return Number.isFinite(parsed) ? parsed : 0;
  }

  function formatDate(timestamp) {
    if (!timestamp) return "Tarih belirtilmemiş";

    return new Date(timestamp).toLocaleString("tr-TR", {
      dateStyle: "medium",
      timeStyle: "short"
    });
  }

  function getSource(article) {
    return getText(article, [
      "source", "sourceName", "publisher"
    ]) || "Haber kaynağı";
  }

  function getUrl(article) {
    const url = getText(article, ["url", "link"]);

    try {
      const parsed = new URL(url);
      return ["https:", "http:"].includes(parsed.protocol)
        ? parsed.href
        : "";
    } catch {
      return "";
    }
  }

  function escapeHTML(value) {
    return String(value).replace(/[&<>"']/g, char => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[char]);
  }

  function importanceClass(level) {
    if (level === "KRİTİK") return "critical";
    if (level === "YÜKSEK") return "high";
    if (level === "DÜŞÜK") return "low";
    return "medium";
  }

  function render() {
    const query = searchInput.value
      .trim()
      .toLocaleLowerCase("tr-TR");

    let articles = allArticles.filter(article => {
      const category = getCategory(article);

      const matchesCategory =
        selectedCategory === "Tümü" ||
        category === selectedCategory;

      const searchable = [
        getTitle(article),
        getSummary(article),
        getSource(article),
        category,
        getImportance(article)
      ].join(" ").toLocaleLowerCase("tr-TR");

      return matchesCategory && searchable.includes(query);
    });

    const sortMode = sortSelect.value;

    articles.sort((a, b) => {
      const dateA = getDate(a);
      const dateB = getDate(b);
      const importanceA = importanceOrder[getImportance(a)] || 2;
      const importanceB = importanceOrder[getImportance(b)] || 2;

      if (sortMode === "newest") {
        return dateB - dateA;
      }

      if (sortMode === "oldest") {
        return dateA - dateB;
      }

      if (sortMode === "importance") {
        return importanceB - importanceA || dateB - dateA;
      }

      // Varsayılan: en yeni tarih önce; eşit tarihte önem önce.
      return dateB - dateA || importanceB - importanceA;
    });

    status.textContent = `${articles.length} haber listeleniyor`;

    if (!articles.length) {
      newsList.innerHTML =
        '<div class="empty">Bu filtrelerle eşleşen haber bulunamadı.</div>';
      return;
    }

    newsList.innerHTML = articles.map(article => {
      const title = escapeHTML(getTitle(article));
      const summary = escapeHTML(getSummary(article));
      const source = escapeHTML(getSource(article));
      const category = escapeHTML(getCategory(article));
      const importance = getImportance(article);
      const date = escapeHTML(formatDate(getDate(article)));
      const url = getUrl(article);

      const impact = escapeHTML(getText(article, [
        "marketImpactTr", "market_impact_tr", "marketImpact"
      ]));

      return `
        <article class="news-card">
          <div class="card-top">
            <span class="tag ${importanceClass(importance)}">
              ${escapeHTML(importance)}
            </span>

            <span class="tag category-tag">${category}</span>

            <span class="meta">${source} · ${date}</span>
          </div>

          <h2>${title}</h2>

          ${summary ? `<p>${summary}</p>` : ""}

          ${impact ? `
            <div class="market-impact">
              <strong>Piyasa etkisi:</strong> ${impact}
            </div>
          ` : ""}

          ${url ? `
            <a class="read-link"
               href="${escapeHTML(url)}"
               target="_blank"
               rel="noopener noreferrer">Haberi oku ↗</a>
          ` : ""}
        </article>
      `;
    }).join("");
  }

  filters.addEventListener("click", event => {
    const button = event.target.closest("button[data-category]");
    if (!button) return;

    selectedCategory = button.dataset.category;

    filters.querySelectorAll("button[data-category]").forEach(item => {
      const active = item === button;
      item.classList.toggle("active", active);
      item.setAttribute("aria-pressed", String(active));
    });

    render();
  });

  searchInput.addEventListener("input", render);
  sortSelect.addEventListener("change", render);

  async function loadNews() {
    status.textContent = "Haberler yükleniyor...";

    try {
      const response = await fetch("./news.json?ts=" + Date.now(), {
        cache: "no-store"
      });

      if (!response.ok) {
        throw new Error("HTTP " + response.status);
      }

      const data = await response.json();
      const items = Array.isArray(data)
        ? data
        : (data.articles || data.items);

      if (!Array.isArray(items)) {
        throw new Error("JSON içinde haber listesi bulunamadı.");
      }

      allArticles = items;
      render();
    } catch (error) {
      console.error("Haber yükleme hatası:", error);
      status.textContent = "Haberler yüklenemedi.";

      newsList.innerHTML = `
        <div class="empty">
          Haberler yüklenemedi. news.json dosyasını ve GitHub Pages bağlantısını kontrol et.
          <br><br>
          <button type="button" onclick="location.reload()">
            Sayfayı Yeniden Yükle
          </button>
        </div>
      `;
    }
  }

  refreshButton.addEventListener("click", async () => {
    if (refreshInProgress) return;

    refreshInProgress = true;
    refreshButton.disabled = true;
    refreshButton.textContent = "Yükleniyor...";

    try {
      await loadNews();
    } finally {
      refreshInProgress = false;
      refreshButton.disabled = false;
      refreshButton.textContent = "↻ Haberleri Yenile";
    }
  });

  loadNews();
})();
</script>
</body>
</html>
