
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b1020">
<title>VCryptoScope | Kripto Haberleri</title>

<style>
:root {
  --bg: #0b1020;
  --panel: #111a2e;
  --panel2: #17233b;
  --border: #293854;
  --text: #e8edf7;
  --muted: #9eabc3;
  --blue: #3b82f6;
  --cyan: #7dd3fc;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
  line-height: 1.5;
}

header {
  background: linear-gradient(135deg, #111a2e, #152442);
  border-bottom: 1px solid var(--border);
  padding: 24px 16px;
}

.container {
  width: 100%;
  max-width: 1100px;
  margin: 0 auto;
}

.header-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}

h1 {
  margin: 0;
  font-size: 27px;
  letter-spacing: 0.3px;
}

.logo-accent {
  color: var(--cyan);
}

.subtitle {
  margin-top: 6px;
  color: var(--muted);
  font-size: 13px;
}

.updated {
  color: var(--muted);
  font-size: 12px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 20px 14px 35px;
}

.search-row {
  display: flex;
  gap: 10px;
  margin-bottom: 16px;
}

#search {
  display: block;
  width: 100%;
  min-width: 0;
  padding: 13px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--panel);
  color: var(--text);
  font-size: 15px;
  outline: none;
}

#search:focus {
  border-color: var(--blue);
}

#search::placeholder {
  color: #7e8da7;
}

.section-title {
  font-size: 13px;
  color: var(--muted);
  margin: 0 0 9px;
}

.filters {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-bottom: 18px;
}

.filters button {
  appearance: none;
  border: 1px solid #34435f;
  background: var(--panel);
  color: #cbd5e7;
  padding: 10px 13px;
  border-radius: 9px;
  font-size: 13px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.filters button:hover {
  border-color: var(--blue);
}

.filters button.active {
  background: var(--blue);
  border-color: var(--blue);
  color: white;
}

.filters button:focus-visible {
  outline: 2px solid var(--cyan);
  outline-offset: 2px;
}

.toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 10px;
  margin: 18px 0 12px;
}

#status {
  color: var(--muted);
  font-size: 13px;
}

#sort {
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--panel);
  color: var(--text);
  padding: 9px;
  font-size: 12px;
  max-width: 100%;
}

.article {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 16px;
  margin-bottom: 12px;
  overflow-wrap: anywhere;
  transition: border-color 0.15s;
}

.article:hover {
  border-color: #405579;
}

.article h2 {
  margin: 0 0 10px;
  font-size: 17px;
  line-height: 1.5;
}

.article h2 a {
  color: #edf3ff;
  text-decoration: none;
}

.article h2 a:hover {
  color: var(--cyan);
}

.summary {
  color: #bac6da;
  font-size: 14px;
  line-height: 1.7;
  margin: 0 0 13px;
  white-space: normal;
}

.meta {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px 13px;
  font-size: 12px;
  color: #8e9db6;
}

.category-label {
  display: inline-block;
  color: var(--cyan);
  background: #102a42;
  border: 1px solid #20435c;
  border-radius: 6px;
  padding: 3px 8px;
}

.source-label {
  color: #c1cce0;
}

.empty, .error {
  padding: 28px 16px;
  border: 1px solid var(--border);
  border-radius: 12px;
  background: var(--panel);
  color: var(--muted);
  text-align: center;
}

.error {
  color: #fca5a5;
}

.load-more-wrap {
  text-align: center;
  margin: 20px 0;
}

#loadMore {
  display: none;
  padding: 11px 20px;
  border: 1px solid var(--border);
  border-radius: 9px;
  background: var(--panel2);
  color: var(--text);
  cursor: pointer;
}

#loadMore:hover {
  border-color: var(--blue);
}

footer {
  text-align: center;
  border-top: 1px solid var(--border);
  padding: 22px 14px;
  color: #74839c;
  font-size: 12px;
}

@media (max-width: 600px) {
  h1 {
    font-size: 23px;
  }

  header {
    padding: 20px 14px;
  }

  main {
    padding: 15px 11px 28px;
  }

  .filters button {
    padding: 9px 11px;
    font-size: 12px;
  }

  .article {
    padding: 14px;
  }

  .article h2 {
    font-size: 16px;
  }

  .toolbar {
    align-items: flex-start;
  }
}
</style>
</head>

<body>

<header>
  <div class="container">
    <div class="header-top">
      <div>
        <h1><span class="logo-accent">VCrypto</span>Scope</h1>
        <div class="subtitle">
          Kripto piyasaları, Bitcoin, Ethereum ve küresel ekonomi
        </div>
      </div>
      <div class="updated" id="updatedAt">Güncelleme bilgisi alınıyor...</div>
    </div>
  </div>
</header>

<main>
  <div class="search-row">
    <input
      id="search"
      type="search"
      placeholder="Haber başlığı, içerik veya kaynak ara..."
      autocomplete="off"
      aria-label="Haberlerde ara"
    >
  </div>

  <p class="section-title">Haber kategorileri</p>

  <div class="filters" id="filters">
    <button type="button" class="active" data-category="Tümü">Tüm Haberler</button>
    <button type="button" data-category="Bitcoin">Bitcoin</button>
    <button type="button" data-category="Ethereum">Ethereum</button>
    <button type="button" data-category="Makroekonomi">Makroekonomi</button>
    <button type="button" data-category="Regülasyon">Regülasyon</button>
    <button type="button" data-category="Kurumsal Yatırım">Kurumsal Yatırım</button>
    <button type="button" data-category="Kripto Piyasası">Kripto Piyasası</button>
  </div>

  <div class="toolbar">
    <div id="status" aria-live="polite">Haberler yükleniyor...</div>

    <select id="sort" aria-label="Haberleri sırala">
      <option value="newest">En yeni haberler</option>
      <option value="oldest">En eski haberler</option>
    </select>
  </div>

  <div id="articles"></div>

  <div class="load-more-wrap">
    <button type="button" id="loadMore">Daha fazla haber göster</button>
  </div>
</main>

<footer>
  VCryptoScope · Haberler bilgilendirme amaçlıdır, yatırım tavsiyesi değildir.
</footer>

<script>
(() => {
  "use strict";

  const searchBox = document.getElementById("search");
  const filterContainer = document.getElementById("filters");
  const filterButtons = Array.from(
    filterContainer.querySelectorAll("button[data-category]")
  );
  const statusBox = document.getElementById("status");
  const articlesBox = document.getElementById("articles");
  const sortBox = document.getElementById("sort");
  const loadMoreButton = document.getElementById("loadMore");
  const updatedAtBox = document.getElementById("updatedAt");

  let allArticles = [];
  let selectedCategory = "Tümü";
  let visibleLimit = 20;

  function normalize(value) {
    return String(value ?? "")
      .trim()
      .toLocaleLowerCase("tr-TR")
      .normalize("NFD")
      .replace(/[\u0300-\u036f]/g, "");
  }

  function escapeHTML(value) {
    return String(value ?? "").replace(/[&<>"']/g, character => ({
      "&": "&amp;",
      "<": "&lt;",
      ">": "&gt;",
      '"': "&quot;",
      "'": "&#39;"
    })[character]);
  }

  function getTitle(article) {
    return article.titleTr ||
      article.title_tr ||
      article.translTitle ||
      article.title ||
      "Başlıksız haber";
  }

  function getSummary(article) {
    return article.summaryTr ||
      article.summary_tr ||
      article.marketImpactTr ||
      article.summary ||
      article.description ||
      "";
  }

  function getCategory(article) {
    const original = article.category || article.categoryTr || "";

    if (original) {
      const value = normalize(original);

      if (value.includes("bitcoin") || value === "btc") {
        return "Bitcoin";
      }

      if (value.includes("ethereum") || value === "eth") {
        return "Ethereum";
      }

      if (
        value.includes("regulasyon") ||
        value.includes("regulation") ||
        value.includes("mevzuat") ||
        value.includes("hukuk")
      ) {
        return "Regülasyon";
      }

      if (
        value.includes("makro") ||
        value.includes("ekonomi") ||
        value.includes("economy") ||
        value.includes("fed") ||
        value.includes("enflasyon")
      ) {
        return "Makroekonomi";
      }

      if (
        value.includes("kurumsal") ||
        value.includes("institutional") ||
        value.includes("etf")
      ) {
        return "Kurumsal Yatırım";
      }

      if (
        value.includes("kripto") ||
        value.includes("crypto") ||
        value.includes("market") ||
        value.includes("piyasa")
      ) {
        return "Kripto Piyasası";
      }
    }

    const text = normalize(
      getTitle(article) + " " + getSummary(article)
    );

    if (/\b(bitcoin|btc)\b/.test(text)) return "Bitcoin";
    if (/\b(ethereum|ether|eth)\b/.test(text)) return "Ethereum";

    if (
      /\b(sec|regulation|regulatory|lawsuit|legislation|ban|regulasyon)\b/.test(text)
    ) {
      return "Regülasyon";
    }

    if (
      /\b(fed|federal reserve|inflation|interest rate|economy|economic|gdp|enflasyon)\b/.test(text)
    ) {
      return "Makroekonomi";
    }

    if (
      /\b(etf|institutional|institution|fund|asset manager)\b/.test(text)
    ) {
      return "Kurumsal Yatırım";
    }

    return "Kripto Piyasası";
  }

  function getDate(article) {
    const value =
      article.publishedAt ||
      article.published_at ||
      article.pubDate ||
      article.date ||
      null;

    if (!value) return null;

    const parsed = new Date(value);
    return Number.isNaN(parsed.getTime()) ? null : parsed;
  }

  function formatDate(article) {
    const date = getDate(article);

    if (!date) return "Tarih bilinmiyor";

    return date.toLocaleString("tr-TR", {
      dateStyle: "medium",
      timeStyle: "short"
    });
  }

  function getFilteredArticles() {
    const query = normalize(searchBox.value);

    const filtered = allArticles.filter(article => {
      const category = getCategory(article);

      const categoryMatches =
        selectedCategory === "Tümü" ||
        normalize(category) === normalize(selectedCategory);

      const searchableText = normalize([
        getTitle(article),
        getSummary(article),
        article.title || "",
        article.summary || "",
        article.description || "",
        article.source || "",
        category
      ].join(" "));

      return categoryMatches && searchableText.includes(query);
    });

    filtered.sort((a, b) => {
      const dateA = getDate(a)?.getTime() || 0;
      const dateB = getDate(b)?.getTime() || 0;

      return sortBox.value === "oldest"
        ? dateA - dateB
        : dateB - dateA;
    });

    return filtered;
  }

  function render() {
    const filtered = getFilteredArticles();
    const visible = filtered.slice(0, visibleLimit);

    statusBox.textContent =
      `${filtered.length} haber bulundu · ${visible.length} haber gösteriliyor`;

    loadMoreButton.style.display =
      filtered.length > visibleLimit ? "inline-block" : "none";

    if (filtered.length === 0) {
      articlesBox.innerHTML =
        '<div class="empty">Bu arama veya kategoride haber bulunamadı.</div>';
      return;
    }

    articlesBox.innerHTML = visible.map(article => {
      const title = getTitle(article);
      const summary = getSummary(article);
      const category = getCategory(article);
      const source = article.source || "Haber kaynağı";
      const url = article.url || article.link || "";

      const safeLink = /^https?:\/\//i.test(url)
        ? escapeHTML(url)
        : "";

      const titleHTML = safeLink
        ? `<a href="${safeLink}" target="_blank" rel="noopener noreferrer">${escapeHTML(title)}</a>`
        : escapeHTML(title);

      return `
        <article class="article">
          <h2>${titleHTML}</h2>

          ${summary
            ? `<p class="summary">${escapeHTML(summary)}</p>`
            : ""}

          <div class="meta">
            <span class="category-label">${escapeHTML(category)}</span>
            <span class="source-label">${escapeHTML(source)}</span>
            <span>${escapeHTML(formatDate(article))}</span>
          </div>
        </article>
      `;
    }).join("");
  }

  filterContainer.addEventListener("click", event => {
    const button = event.target.closest("button[data-category]");

    if (!button || !filterContainer.contains(button)) return;

    selectedCategory = button.dataset.category || "Tümü";
    visibleLimit = 20;

    filterButtons.forEach(item => {
      const isActive = item === button;
      item.classList.toggle("active", isActive);
      item.setAttribute("aria-pressed", String(isActive));
    });

    render();
  });

  filterButtons.forEach(button => {
    button.setAttribute(
      "aria-pressed",
      String(button.dataset.category === selectedCategory)
    );
  });

  searchBox.addEventListener("input", () => {
    visibleLimit = 20;
    render();
  });

  sortBox.addEventListener("change", () => {
    visibleLimit = 20;
    render();
  });

  loadMoreButton.addEventListener("click", () => {
    visibleLimit += 20;
    render();
  });

  async function loadNews() {
    try {
      statusBox.textContent = "Haberler yükleniyor...";

      const response = await fetch(
        "./news.json?cacheBust=" + Date.now(),
        { cache: "no-store" }
      );

      if (!response.ok) {
        throw new Error("Haber dosyası alınamadı: HTTP " + response.status);
      }

      const data = await response.json();

      allArticles = Array.isArray(data)
        ? data
        : Array.isArray(data.articles)
          ? data.articles
          : Array.isArray(data.items)
            ? data.items
            : [];

      if (data.updatedAt) {
        updatedAtBox.textContent =
          "Son güncelleme: " +
          new Date(data.updatedAt).toLocaleString("tr-TR");
      } else {
        updatedAtBox.textContent = "Haber akışı";
      }

      if (!allArticles.length) {
        statusBox.textContent = "Haber bulunamadı.";
        articlesBox.innerHTML =
          '<div class="empty">Haber akışı şu anda boş.</div>';
        return;
      }

      render();
    } catch (error) {
      console.error("VCryptoScope haber yükleme hatası:", error);

      statusBox.textContent = "Haberler yüklenemedi.";

      articlesBox.innerHTML =
        '<div class="error">Haber dosyası okunamadı. İnternet bağlantısını kontrol edip sayfayı yenileyin.</div>';
    }
  }

  loadNews();
})();
</script>

</body>
</html>
