<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#08111f">
<title>VCryptoScope | Haberler</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#08111f;color:#edf4ff;font-family:Arial,sans-serif}
.container{max-width:1100px;margin:auto;padding:20px}
header{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;border-bottom:1px solid #263750;padding-bottom:20px}
.logo{font-size:23px;font-weight:bold;color:#fff;text-decoration:none}
.logo span{color:#4d83ff}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav a{color:#91a4bd;text-decoration:none;padding:9px;border-radius:8px}
nav a.active,nav a:hover{background:#1b3153;color:white}
h1{font-size:clamp(28px,5vw,42px);margin-bottom:8px}
p{line-height:1.6}
.muted{color:#91a4bd}
.status{margin:20px 0;padding:14px;background:#101c2e;border:1px solid #263750;border-radius:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
button{cursor:pointer;border:0;border-radius:9px;padding:11px 14px;background:#3978ff;color:white;font-weight:bold}
button:disabled{opacity:.6}
.search{width:100%;padding:14px;background:#101c2e;color:white;border:1px solid #263750;border-radius:10px;font-size:16px;margin:8px 0 14px}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}
.chip{background:#101c2e;border:1px solid #263750;color:#91a4bd}
.chip.active{background:#2457d6;color:white}
.heading{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.article{background:#101c2e;border:1px solid #263750;border-radius:14px;padding:18px;display:flex;flex-direction:column;overflow-wrap:anywhere}
.article h3{font-size:17px;line-height:1.5}
.meta{font-size:12px;color:#91a4bd}
.tag{font-size:11px;color:#30d6a0;font-weight:bold}
.bottom{border-top:1px solid #263750;padding-top:12px;margin-top:auto;display:flex;justify-content:space-between;gap:10px;align-items:center}
.read{color:#8db2ff;text-decoration:none;font-weight:bold;font-size:13px}
.message{grid-column:1/-1;padding:28px;text-align:center;background:#101c2e;border:1px solid #263750;border-radius:12px;color:#91a4bd;overflow-wrap:anywhere}
.message strong{display:block;color:white;margin-bottom:8px}
footer{margin-top:35px;padding-top:20px;border-top:1px solid #263750;color:#91a4bd;font-size:12px;text-align:center}
@media(max-width:650px){.container{padding:14px}.grid{grid-template-columns:1fr}header{align-items:flex-start}nav{width:100%}.article{padding:15px}}
</style>
</head>
<body>
<div class="container">
<header>
<a class="logo" href="./index.html">VCrypto<span>Scope</span></a>
<nav>
<a href="./index.html">Ana Sayfa</a>
<a href="./analysis.html">Analiz</a>
<a class="active" href="./news.html">Haberler</a>
</nav>
</header>

<main>
<h1>Piyasa Haberleri</h1>
<p class="muted">Bitcoin, altcoinler ve küresel ekonomiden son gelişmeler.</p>

<div class="status">
<span id="status">Haberler yükleniyor...</span>
<button id="refresh" type="button">↻ Yenile</button>
</div>

<input id="search" class="search" type="search" placeholder="Bitcoin, Fed, Ethereum ara...">

<div class="filters" id="filters">
<button class="chip active" data-cat="all">Tümü</button>
<button class="chip" data-cat="bitcoin">Bitcoin</button>
<button class="chip" data-cat="altcoin">Altcoin</button>
<button class="chip" data-cat="economy">Ekonomi</button>
<button class="chip" data-cat="other">Diğer</button>
</div>

<div class="heading">
<h2>Son gelişmeler</h2>
<span id="count" class="muted"></span>
</div>

<div class="grid" id="news">
<div class="message">Haberler yükleniyor...</div>
</div>
</main>

<footer>
<p>VCryptoScope — Piyasa haberleri</p>
<p>Bilgilendirme amaçlıdır, yatırım tavsiyesi değildir.</p>
</footer>
</div>

<script>
const newsBox=document.getElementById("news");
const statusBox=document.getElementById("status");
const countBox=document.getElementById("count");
const searchBox=document.getElementById("search");
const refreshBtn=document.getElementById("refresh");
const filters=document.getElementById("filters");
let articles=[];
let category="all";

function message(title,detail,retry=false){
newsBox.replaceChildren();
const box=document.createElement("div");
box.className="message";
const strong=document.createElement("strong");
strong.textContent=title;
const p=document.createElement("p");
p.textContent=detail;
box.append(strong,p);
if(retry){
const b=document.createElement("button");
b.textContent="Tekrar dene";
b.onclick=loadNews;
box.append(b);
}
newsBox.append(box);
countBox.textContent="0 haber";
}

function detect(a){
const t=((a.title||"")+" "+(a.source||"")).toLowerCase();
if(/bitcoin|\bbtc\b/.test(t))return "bitcoin";
if(/ethereum|\beth\b|altcoin|solana|xrp|ripple|dogecoin|avax|crypto|kripto|token/.test(t))return "altcoin";
if(/fed|faiz|inflation|enflasyon|ekonomi|economic|dolar|petrol|oil|istihdam|recession|resesyon|merkez bank/.test(t))return "economy";
return "other";
}

function dateText(value){
if(!value)return "Tarih belirtilmemiş";
const d=new Date(value);
if(Number.isNaN(d.getTime()))return "Tarih belirtilmemiş";
return new Intl.DateTimeFormat("tr-TR",{dateStyle:"medium",timeStyle:"short",timeZone:"Europe/Istanbul"}).format(d);
}

function render(){
const q=searchBox.value.trim().toLocaleLowerCase("tr-TR");
const visible=articles.filter(a=>{
const text=((a.title||"")+" "+(a.source||"")).toLocaleLowerCase("tr-TR");
return text.includes(q)&&(category==="all"||detect(a)===category);
});
newsBox.replaceChildren();
if(!visible.length){
message("Haber bulunamadı","Aramanı veya kategori seçimini değiştirebilirsin.");
return;
}
const frag=document.createDocumentFragment();
visible.forEach(a=>{
const card=document.createElement("article");
card.className="article";
const tag=document.createElement("span");
tag.className="tag";
tag.textContent=detect(a).toUpperCase();
const meta=document.createElement("div");
meta.className="meta";
meta.style.marginTop="8px";
meta.textContent=dateText(a.publishedAt);
const title=document.createElement("h3");
title.textContent=a.title;
const bottom=document.createElement("div");
bottom.className="bottom";
const source=document.createElement("span");
source.className="meta";
source.textContent=a.source||"Haber kaynağı";
const link=document.createElement("a");
link.className="read";
link.href=a.url;
link.target="_blank";
link.rel="noopener noreferrer";
link.textContent="Haberi oku ↗";
bottom.append(source,link);
card.append(tag,meta,title,bottom);
frag.append(card);
});
newsBox.append(frag);
countBox.textContent=visible.length+" haber";
}

async function loadNews(){
refreshBtn.disabled=true;
refreshBtn.textContent="Yükleniyor...";
statusBox.textContent="news.json okunuyor...";
try{
const response=await fetch("./news.json?t="+Date.now(),{cache:"no-store"});
if(!response.ok)throw new Error("HTTP "+response.status+" — news.json dosyası açılamadı.");
const data=await response.json();
if(!data||!Array.isArray(data.articles))throw new Error("JSON içinde articles listesi bulunamadı.");
articles=data.articles.filter(a=>a&&typeof a.title==="string"&&typeof a.url==="string"&&/^https?:\/\//i.test(a.url));
articles.sort((a,b)=>(new Date(b.publishedAt||0).getTime()||0)-(new Date(a.publishedAt||0).getTime()||0));
if(!articles.length){
statusBox.textContent="Haber bulunamadı";
message("Haber listesi boş","news.json içinde geçerli haber yok.",true);
return;
}
statusBox.textContent=articles.length+" haber yüklendi · Son güncelleme: "+dateText(data.updatedAt);
render();
}catch(error){
console.error(error);
statusBox.textContent="Haberler yüklenemedi";
message("Haber yükleme hatası",error.message+" GitHub Pages ve news.json dosyasını kontrol et.",true);
}finally{
refreshBtn.disabled=false;
refreshBtn.textContent="↻ Yenile";
}
}

searchBox.addEventListener("input",render);
filters.addEventListener("click",e=>{
const b=e.target.closest("button[data-cat]");
if(!b)return;
category=b.dataset.cat;
filters.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===b));
render();
});
refreshBtn.addEventListener("click",loadNews);
loadNews();
</script>
</body>
</html>
