
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="icon.svg?v=6">\n<title>VCryptoScope Haberleri</title>
<style>
:root{--bg:#080d18;--panel:#111a2b;--border:#26334a;--text:#e8eef8;--muted:#8c9bb2;--accent:#38bdf8}
*{box-sizing:border-box}
body{margin:0;padding:20px;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
.container{max-width:1100px;margin:auto}
.header,.top-actions,.toolbar,.filters,.card-top,.status-row{display:flex;flex-wrap:wrap;gap:10px}
.header,.status-row{justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.brand .logo{width:44px;height:44px;border-radius:14px;overflow:hidden;display:grid;place-items:center;flex:0 0 44px;box-shadow:0 8px 28px #1ce0bd30}
.brand .logo img{display:block;width:44px;height:44px;object-fit:contain}
.brand h1{font-size:20px;margin:0;letter-spacing:-.5px}
.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}
h1{font-size:28px}
.subtitle,.status,.meta{color:var(--muted)}
button,input,select{font:inherit}
button{cursor:pointer}
.action-button,input,select,.filters button{border:1px solid var(--border);background:var(--panel);color:var(--text);padding:11px 14px;border-radius:8px}
.action-button{text-decoration:none;font-size:13px}
.refresh-button,.filters button.active{background:#123653;border-color:var(--accent);color:#7dd3fc}
.toolbar{margin:18px 0}
#searchInput{flex:1;min-width:200px}
.section-title{font-size:14px;font-weight:bold;margin:22px 0 10px;color:#d5e2f5}
.filters button{border-radius:20px;font-size:13px}
.importance-filters button.active[data-importance="KRİTİK"]{background:#491b26;color:#ff9baa}
.importance-filters button.active[data-importance="YÜKSEK"]{background:#4a2b16;color:#ffbf83}
.importance-filters button.active[data-importance="ORTA"]{background:#453b16;color:#f9df70}
.importance-filters button.active[data-importance="DÜŞÜK"]{background:#163d30;color:#76e4b1}
.news-card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px;margin:13px 0}
.card-top{align-items:center;margin-bottom:12px}
.tag{font-size:11px;font-weight:bold;border-radius:5px;padding:5px 8px}
.critical{background:#491b26;color:#ff8294}.high{background:#4a2b16;color:#ffb36b}
.medium{background:#453b16;color:#f9df70}.low{background:#163d30;color:#76e4b1}
.category-tag{background:#1b2c44;color:#9dcaff}
.news-card h2{font-size:18px;line-height:1.5;margin:0 0 10px}
.news-card p{color:#b9c6d9;line-height:1.65;font-size:14px}
.market-impact{border-left:3px solid var(--accent);padding:9px 11px;margin:12px 0;background:#0c1728;color:#c5d8ee;font-size:13px;line-height:1.6}
.read-link{color:var(--accent);text-decoration:none;font-size:13px;font-weight:bold}
.empty{padding:28px;text-align:center;color:var(--muted);border:1px dashed var(--border);border-radius:12px}
@media(max-width:650px){body{padding:14px}.header{align-items:flex-start}h1{font-size:24px}.top-actions{width:100%}.action-button{flex:1;text-align:center}.toolbar>*{width:100%}.news-card{padding:14px}.news-card h2{font-size:16px}}

.site-nav{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin:8px 0 14px}.site-nav a{display:inline-flex;align-items:center;justify-content:center;padding:8px 11px;border:1px solid var(--line,#263550);border-radius:10px;background:var(--panel,#111a2b);color:var(--text,#eef3ff);text-decoration:none;font-size:12px;font-weight:650;white-space:nowrap}.site-nav a:hover{border-color:var(--blue,#7d9cff)}@media(max-width:700px){.site-nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%}.site-nav a{padding:9px 5px;font-size:11px;text-align:center;white-space:normal}}
</style>
</head>
<body>
<div class="container">
<header class="header">
<div class="brand"><div class="logo"><img src="icon.svg?v=6" alt="VCryptoScope"></div><div><h1>VCryptoScope</h1><p>Kripto ve piyasa haberleri</p></div></div>
<nav class="site-nav" aria-label="Ana gezinme">
<a href="./index.html?view=tree&nav=1"><svg aria-hidden="true" viewBox="0 0 24 24" style="width:16px;height:16px;flex-shrink:0;vertical-align:middle;margin-right:6px" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3" y="3" width="8" height="8" rx="1.5"/><rect x="13" y="3" width="8" height="5" rx="1.5"/><rect x="13" y="10" width="8" height="11" rx="1.5"/><rect x="3" y="13" width="8" height="8" rx="1.5"/></svg>Ağaç Haritası</a><a href="./index.html?view=market&nav=1"><svg aria-hidden="true" viewBox="0 0 24 24" style="width:16px;height:16px;flex-shrink:0;vertical-align:middle;margin-right:6px" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M9 6h12M9 12h12M9 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>Coin Listesi</a><a href="./analysis.html?nav=1"><svg aria-hidden="true" viewBox="0 0 24 24" style="width:16px;height:16px;flex-shrink:0;vertical-align:middle;margin-right:6px" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><path d="m6 15 4-5 4 3 6-8"/></svg>Analiz</a><a href="./backtest.html?nav=1"><svg aria-hidden="true" viewBox="0 0 24 24" style="width:16px;height:16px;flex-shrink:0;vertical-align:middle;margin-right:6px" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5M7.5 10.5h6M10.5 7.5v6"/></svg>Otomatik Tarayıcı</a><a href="./news.html?nav=1"><svg aria-hidden="true" viewBox="0 0 24 24" style="width:16px;height:16px;flex-shrink:0;vertical-align:middle;margin-right:6px" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 4h14a2 2 0 0 1 2 2v13H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M7 8h5v5H7zM15 8h3M15 11h3M7 16h11"/></svg>Piyasa Haberleri</a>
</nav><div class="top-actions">
<a class="action-button" href="./index.html">← Ana Sayfaya Dön</a>
<button class="action-button refresh-button" id="refreshButton">↻ Verileri Yenile</button>
</div>
</header>
<p class="subtitle">Kripto, merkez bankaları, enflasyon, enerji ve küresel piyasalar</p>
<div class="toolbar">
<input id="searchInput" type="search" placeholder="Haber, kaynak veya kelime ara...">
<select id="sortSelect">
<option value="dateImportance">Tarih ve önem sırasına göre</option>
<option value="newest">En yeni tarih önce</option>
<option value="importance">Önem seviyesi önce</option>
<option value="oldest">En eski tarih önce</option>
</select>
</div>
<div class="section-title">Kategoriye göre filtrele</div>
<div class="filters" id="categoryFilters">
<button class="active" data-category="Tümü">Tüm Haberler</button>
<button data-category="Kripto">Kripto</button>
<button data-category="Fed & Faiz">Fed &amp; Faiz</button>
<button data-category="İstihdam & Enflasyon">İstihdam &amp; Enflasyon</button>
<button data-category="Petrol & Enerji">Petrol &amp; Enerji</button>
<button data-category="Regülasyon">Regülasyon</button>
<button data-category="Küresel Piyasalar">Küresel Piyasalar</button>
</div>
<div class="section-title">Önem derecesine göre filtrele</div>
<div class="filters importance-filters" id="importanceFilters">
<button class="active" data-importance="Tümü">Tüm Önem Seviyeleri</button>
<button data-importance="KRİTİK">🔴 KRİTİK</button>
<button data-importance="YÜKSEK">🟠 YÜKSEK</button>
<button data-importance="ORTA">🟡 ORTA</button>
<button data-importance="DÜŞÜK">🟢 DÜŞÜK</button>
</div>
<div class="status-row"><div id="status" class="status">Haberler yükleniyor...</div></div>
<div id="newsList"></div>
</div>
<script>
(() => {
"use strict";
const $=id=>document.getElementById(id);
const list=$("newsList"),status=$("status"),search=$("searchInput"),sort=$("sortSelect");
let articles=[],cat="Tümü",imp="Tümü",busy=false;
const order={"KRİTİK":4,"YÜKSEK":3,"ORTA":2,"DÜŞÜK":1};
const txt=(a,keys)=>{for(const k of keys){const v=a?.[k];if(typeof v==="string"&&v.trim())return v.trim();if(typeof v==="number")return String(v)}return ""};
const title=a=>txt(a,["titleTr","title_tr","translatedTitle","title"])||"Başlıksız haber";
const summary=a=>txt(a,["summaryTr","summary_tr","descriptionTr","summary","description"]);
const fold=s=>String(s||"").trim().toLocaleLowerCase("tr-TR");
function level(a){const v=fold(txt(a,["importance","priority","severity"])).toUpperCase();if(v.includes("KRİTİK")||v.includes("KRITIK"))return "KRİTİK";if(v.includes("YÜKSEK")||v.includes("YUKSEK"))return "YÜKSEK";if(v.includes("DÜŞÜK")||v.includes("DUSUK"))return "DÜŞÜK";return "ORTA"}
function category(a){
const raw=fold(txt(a,["category","kategori"]));
const t=fold(title(a)+" "+summary(a)+" "+txt(a,["source","publisher"]));
if(["kripto","fed & faiz","istihdam & enflasyon","petrol & enerji","regülasyon","küresel piyasalar"].includes(raw))return {"kripto":"Kripto","fed & faiz":"Fed & Faiz","istihdam & enflasyon":"İstihdam & Enflasyon","petrol & enerji":"Petrol & Enerji","regülasyon":"Regülasyon","küresel piyasalar":"Küresel Piyasalar"}[raw];
if(/regülasyon|regulasyon|regulation|\bsec\b|lawsuit|crypto law|regulator/.test(t))return "Regülasyon";
if(/crude oil|brent|opec|petrol|oil price|natural gas|energy prices/.test(t))return "Petrol & Enerji";
if(/employment|jobs report|jobless|unemployment|payroll|istihdam|işsizlik|issizlik|enflasyon|inflation|\bcpi\b|\bpce\b/.test(t))return "İstihdam & Enflasyon";
if(/federal reserve|\bfed\b|interest rate|rate cut|rate hike|faiz|central bank|powell|makroekonomi/.test(t)||raw==="makroekonomi")return "Fed & Faiz";
if(/global markets|stock market|equities|bond yields|forex|dollar index|world markets/.test(t))return "Küresel Piyasalar";
if(/bitcoin|btc\b|ethereum|\beth\b|crypto|cryptocurrency|digital asset|altcoin|blockchain/.test(t)||["bitcoin","ethereum","kripto piyasası","kripto piyasasi","crypto","cryptocurrency"].includes(raw))return "Kripto";
if(raw==="kurumsal yatırım"||raw==="kurumsal yatirim")return "Kripto";
return "Küresel Piyasalar";
}
const date=a=>{const n=Date.parse(txt(a,["publishedAt","published_at","date","pubDate"]));return Number.isFinite(n)?n:0};
const dateLabel=n=>n?new Date(n).toLocaleString("tr-TR",{dateStyle:"medium",timeStyle:"short"}):"Tarih belirtilmemiş";
const source=a=>txt(a,["source","sourceName","publisher"])||"Haber kaynağı";
const url=a=>{try{const u=new URL(txt(a,["url","link"]));return ["https:","http:"].includes(u.protocol)?u.href:""}catch{return ""}};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function render(){
const q=fold(search.value);
let shown=articles.filter(a=>(cat==="Tümü"||category(a)===cat)&&(imp==="Tümü"||level(a)===imp)&&fold([title(a),summary(a),source(a),category(a),level(a),txt(a,["marketImpactTr","marketImpact"])].join(" ")).includes(q));
shown.sort((a,b)=>sort.value==="newest"?date(b)-date(a):sort.value==="oldest"?date(a)-date(b):sort.value==="importance"?(order[level(b)]||2)-(order[level(a)]||2)||date(b)-date(a):date(b)-date(a)||(order[level(b)]||2)-(order[level(a)]||2));
status.textContent=`${shown.length} haber listeleniyor · Toplam ${articles.length} haber`;
if(!shown.length){list.innerHTML='<div class="empty">Bu filtrelerle eşleşen haber bulunamadı.</div>';return}
list.innerHTML=shown.map(a=>{const l=level(a),u=url(a),impact=txt(a,["marketImpactTr","market_impact_tr","marketImpact"]);return `<article class="news-card"><div class="card-top"><span class="tag ${l==="KRİTİK"?"critical":l==="YÜKSEK"?"high":l==="DÜŞÜK"?"low":"medium"}">${esc(l)}</span><span class="tag category-tag">${esc(category(a))}</span><span class="meta">${esc(source(a))} · ${esc(dateLabel(date(a)))}</span></div><h2>${esc(title(a))}</h2>${summary(a)?`<p>${esc(summary(a))}</p>`:""}${impact?`<div class="market-impact"><strong>Piyasa etkisi:</strong> ${esc(impact)}</div>`:""}${u?`<a class="read-link" href="${esc(u)}" target="_blank" rel="noopener noreferrer">Haberi oku ↗</a>`:""}</article>`}).join("");
}
function setButtons(parent,attr,value){parent.querySelectorAll("button").forEach(b=>{const active=b.dataset[attr]===value;b.classList.toggle("active",active);b.setAttribute("aria-pressed",String(active))})}
$("categoryFilters").addEventListener("click",e=>{const b=e.target.closest("button[data-category]");if(!b)return;cat=b.dataset.category;setButtons($("categoryFilters"),"category",cat);render()});
$("importanceFilters").addEventListener("click",e=>{const b=e.target.closest("button[data-importance]");if(!b)return;imp=b.dataset.importance;setButtons($("importanceFilters"),"importance",imp);render()});
search.addEventListener("input",render);sort.addEventListener("change",render);
async function load(){status.textContent="Veriler yükleniyor...";try{const r=await fetch("./news.json?ts="+Date.now(),{cache:"no-store"});if(!r.ok)throw Error("HTTP "+r.status);const d=await r.json();const items=Array.isArray(d)?d:d.articles||d.items;if(!Array.isArray(items))throw Error("Haber listesi bulunamadı");articles=items;render()}catch(e){console.error(e);status.textContent="Veriler yüklenemedi.";list.innerHTML='<div class="empty">news.json yüklenemedi. İnternet bağlantısını ve dosyayı kontrol et.</div>'}}
$("refreshButton").addEventListener("click",async()=>{if(busy)return;busy=true;const b=$("refreshButton");b.disabled=true;b.textContent="Yenileniyor...";try{await load()}finally{busy=false;b.disabled=false;b.textContent="↻ Verileri Yenile"}});
load();
})();
</script>
</body>
</html>
